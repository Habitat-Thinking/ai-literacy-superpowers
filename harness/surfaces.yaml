# Control-surface capability matrix.
#
# What each surface CAN actually enforce — not what we wish it could. The
# Harness Registrar compiles governance against this file, and
# `harness/enforcement-report.md` states, for every rule on every surface, the
# enforcement level it INTENDS and the one it ACHIEVES.
#
# A rule that intends `blocked` on a surface supporting only `advisory` is an
# enforcement gap. It is reported, never silently downgraded — knowing which
# rules are genuinely enforced and which are merely written down is the point.
#
# Schema and validation: ai-literacy-superpowers/scripts/check-harness-decisions.py
# Spec: docs/superpowers/specs/2026-08-23-harness-evolution-s0-schema-validator-design.md §6

# Where a rule's TEXT goes, by classification. Two have a fixed home; the rest
# name their own `target`, because nothing in the schema can infer which of four
# agent files a given agent instruction belongs in.
# A `routes:` block MERGES with the plugin's defaults (`effective_routes`), so a
# default this file does not mention stays in force. Map one to an empty value to
# suppress it, which makes records of that classification name their own target.
# The entries below are explicit so this project pins them even if a default moves.
routes:
  harness-loop: HARNESS.md
  turn-instructions: AGENTS.md
  # A rule about a validator is still a rule about how work proceeds here, and
  # its text is prose. Before this route existed the classification named a
  # script as its target and the compiler appended markdown to it (#551).
  script-validator: HARNESS.md

# Who is TOLD about a rule, and how strongly it binds there. Compilation does not
# write into these files: `.github/copilot-instructions.md`, `.cursor/rules/` and
# `.windsurf/rules/` are already generated from HARNESS.md by /convention-sync,
# and a second generator on the same file produces the same rule twice in two
# voices. A rule reaches those surfaces once it is in HARNESS.md, and the
# enforcement report says so rather than claiming they are ungoverned.
surfaces:
  # The only surface with a hook system, so the only one that can refuse a tool
  # call before it happens.
  claude-code:
    targets: [CLAUDE.md, .claude/agents/, .claude/hooks/, .claude/settings.json]
    supports: [advisory, validated, blocked]

  # AGENTS.md is read as instruction. Nothing reads it and refuses.
  codex:
    targets: [AGENTS.md]
    supports: [advisory]

  cursor:
    targets: [.cursor/rules/constraints.mdc, .cursor/rules/conventions.mdc]
    supports: [advisory]

  copilot:
    targets: [.github/copilot-instructions.md]
    supports: [advisory]

  windsurf:
    targets: [.windsurf/rules/constraints.md, .windsurf/rules/conventions.md]
    supports: [advisory]

  # The surface that can actually stop a merge. Everything a rule wants to make
  # non-negotiable has to reach here or admit it is advice.
  ci:
    targets: [.github/workflows/]
    supports: [validated, blocked]
